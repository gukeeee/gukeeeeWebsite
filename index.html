<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gukeeee</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <link rel="manifest" href="manifest.json">
    <style>
      .hero {
        max-width: 720px;
        margin: 0 auto;
        padding: var(--space-7) var(--space-5);
        text-align: center;
      }
      .hero__eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--color-accent);
        margin-bottom: var(--space-3);
      }
      .hero__title {
        font-size: clamp(2.6rem, 7vw, 4.2rem);
        font-weight: 700;
        background: linear-gradient(135deg, var(--color-primary), #a29bfe);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: var(--space-4);
      }
      .hero__subtitle {
        color: var(--color-text-muted);
        font-size: 1.05rem;
        margin-bottom: var(--space-6);
      }
      .hero__cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: var(--space-4);
        margin-top: var(--space-6);
      }
      .hero-card {
        display: block;
        text-decoration: none;
        color: inherit;
        cursor: pointer;
      }
      .hero-card__icon { font-size: 1.6rem; margin-bottom: var(--space-2); }
      .hero-card__title { font-weight: 700; margin-bottom: 4px; }
      .hero-card__desc { font-size: 0.82rem; color: var(--color-text-muted); }
      #install-button { margin-top: var(--space-5); display: none; }
    </style>
  </head>
  <body data-theme="home">
    <div id="site-header" data-active="home"></div>

    <main class="hero">
      <div class="hero__eyebrow">Welcome</div>
      <h1 class="hero__title">gukeeee</h1>
      <p class="hero__subtitle">One place for your Spanish checks, sports streams, and verb practice.</p>
      <button id="install-button" class="btn btn-primary">Install app</button>

      <div class="hero__cards">
        <a class="hero-card card" href="/chequeo.html">
          <div class="hero-card__icon">📝</div>
          <div class="hero-card__title">Chequeo</div>
          <div class="hero-card__desc">Practice and review your class answers.</div>
        </a>
        <a class="hero-card card" href="/verbos.html">
          <div class="hero-card__icon">🔤</div>
          <div class="hero-card__title">Prueba de Verbos</div>
          <div class="hero-card__desc">Look up conjugations and practice verbs.</div>
        </a>
        <a class="hero-card card" href="/sports.html">
          <div class="hero-card__icon">🏆</div>
          <div class="hero-card__title">Sports</div>
          <div class="hero-card__desc">Watch your favorite teams live.</div>
        </a>
      </div>
    </main>

    <p class="footer-note">gukeeee</p>

    <script src="auth.js"></script>
    <script src="header.js"></script>
    <script>
      // Check for redirects saved by 404.html for deep links that aren't the sports page
      document.addEventListener('DOMContentLoaded', function () {
        const redirectPath = sessionStorage.getItem('redirectPath');
        if (redirectPath) {
          sessionStorage.removeItem('redirectPath');
          if (redirectPath.includes('/sports')) {
            window.location.href = `/sports.html${redirectPath.includes('/sports/') ? '?path=' + encodeURIComponent(redirectPath) : ''}`;
          } else {
            window.history.replaceState(null, '', redirectPath);
          }
        }
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js').then(() => console.log('Service Worker Registered'));
      }

      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const installButton = document.getElementById('install-button');
        installButton.style.display = 'inline-flex';
        installButton.addEventListener('click', () => {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
        });
      });
    </script>
  </body>
</html>
