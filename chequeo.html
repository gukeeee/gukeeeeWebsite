<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chequeo de Verbos</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="chequeo.css">
</head>
<body data-theme="chequeo">
    <div id="site-header" data-active="chequeo"></div>

    <main class="page page--narrow">
        <div class="card">
            <div class="row between" style="margin-bottom: var(--space-4);">
                <h1 style="margin:0;">Chequeo de Verbos</h1>
                <select id="class-selector" class="input" style="width:auto;">
                    <option value="Clase 6">Clase 6</option>
                    <option value="Clase 7">Clase 7</option>
                </select>
            </div>

            <form id="quiz-form" class="stack"></form>
            <div class="row" style="margin-top: var(--space-4);">
                <button type="button" class="btn btn-primary" id="check-button">Check your answers</button>
                <button type="button" class="btn btn-danger" id="clear-button">Clear your answers</button>
            </div>
            <div id="result" class="result" style="margin-top: var(--space-4); font-weight: 700;"></div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script src="header.js"></script>
    <script src="chequeo.js"></script>
</body>
</html>
