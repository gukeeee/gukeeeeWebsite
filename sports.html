<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Streamer</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="sports.css">
    <!-- Add Font Awesome for the X icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-theme="sports">
    <div id="site-header" data-active="sports"></div>

    <div id="page-container">
        <div class="container">
            <h1 id="sport-title">Sports Streamer</h1>
            <div id="team-controls" class="team-controls">
                <input
                    type="text"
                    id="teamInput"
                    class="team-input"
                    placeholder="Team name (e.g. Arsenal)"
                />
                <div class="buttons-container">
                    <button id="updateButton" class="green-button">Watch Team</button>
                    <button id="clearButton" class="clear-button">Clear Team</button>
                </div>
            </div>
            <div id="currentTeam" class="current-team"></div>
            <div id="sport-message" class="sport-message" style="display: none;">
                Streaming all games
            </div>
            <div class="button-row">
                <button id="shareButton" class="share-button">Share This Stream</button>
                <button id="reloadButton" class="reload-button">Reload Stream</button>
            </div>
            <!-- Updated share link with close button -->
            <div class="share-link-container" id="shareLinkContainer">
                <input type="text" id="shareLink" readonly>
                <button class="close-button" id="closeShareLink">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <div id="iframe-container" class="iframe-container">
            <iframe
                id="sportsFrame"
                frameborder="0"
                allowfullscreen
                scrolling="yes"
                allowtransparency
                sandbox="allow-scripts allow-same-origin">
            </iframe>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="header.js"></script>
    <script>
        // Add the sport selector into the shared nav area once it's rendered
        document.addEventListener('DOMContentLoaded', function () {
            const nav = document.getElementById('site-nav');
            if (!nav) return;
            const wrapper = document.createElement('div');
            wrapper.className = 'sport-dropdown';
            wrapper.innerHTML = `
                <select id="sport-selector" class="input">
                    <option value="soccer">Soccer</option>
                    <option value="nba">Basketball</option>
                    <option value="nfl">Football</option>
                    <option value="nhl">Hockey</option>
                </select>
            `;
            nav.prepend(wrapper);
            init();
        });

        // Get elements
        let sportSelector, sportTitle, teamInput, updateButton, clearButton, sportsFrame,
            iframeContainer, currentTeam, teamControls, sportMessage, shareButton, shareLink,
            reloadButton, shareLinkContainer, closeShareLink;

        function cacheElements() {
            sportSelector = document.getElementById('sport-selector');
            sportTitle = document.getElementById('sport-title');
            teamInput = document.getElementById('teamInput');
            updateButton = document.getElementById('updateButton');
            clearButton = document.getElementById('clearButton');
            sportsFrame = document.getElementById('sportsFrame');
            iframeContainer = document.getElementById('iframe-container');
            currentTeam = document.getElementById('currentTeam');
            teamControls = document.getElementById('team-controls');
            sportMessage = document.getElementById('sport-message');
            shareButton = document.getElementById('shareButton');
            shareLink = document.getElementById('shareLink');
            reloadButton = document.getElementById('reloadButton');
            shareLinkContainer = document.getElementById('shareLinkContainer');
            closeShareLink = document.getElementById('closeShareLink');
        }

        // Map friendly sport names to their dropdown values
        const sportMapping = {
            'soccer': 'soccer',
            'basketball': 'nba',
            'football': 'nfl',
            'hockey': 'nhl',
            'collegebasketball': 'collegebball',
            'collegefootball': 'collegefball',
            'baseball': 'mlb'
        };

        // Map dropdown values to friendly names
        const reverseSportMapping = {
            'soccer': 'soccer',
            'nba': 'basketball',
            'nfl': 'football',
            'nhl': 'hockey',
            'collegebball': 'collegebasketball',
            'collegefball': 'collegefootball',
            'mlb': 'baseball'
        };

        // Sport-specific configuration
        const sportConfig = {
            soccer: {
                baseUrl: 'https://givemereddit.org/soccer/',
                title: 'Soccer Streamer',
                placeholder: 'Team name (e.g. Arsenal)',
                storageKey: 'soccer_team',
                requiresTeam: true,
                message: '',
                suffix: '.html'
            },
            nba: {
                baseUrl: 'https://givemereddit.org/nba/',
                title: 'Basketball Streamer',
                placeholder: 'Team name (e.g. Warriors)',
                storageKey: 'basketball_team',
                requiresTeam: true,
                message: '',
                suffix: '.html'
            },
            nfl: {
                baseUrl: 'https://givemereddit.org/nfl/',
                title: 'Football Streamer',
                placeholder: 'Team name (e.g. 49ers)',
                storageKey: 'football_team',
                requiresTeam: true,
                message: '',
                suffix: '.html'
            },
            collegebball: {
                baseUrl: 'https://crackstreams.cx/ncaabstreams/live',
                title: 'College Basketball Streamer',
                placeholder: '',
                storageKey: 'collegebball_team',
                requiresTeam: false,
                message: 'Streaming all College Basketball games',
                suffix: ''
            },
            collegefball: {
                baseUrl: 'https://crackstreams.cx/cfbstreams/live',
                title: 'College Football Streamer',
                placeholder: '',
                storageKey: 'collegefball_team',
                requiresTeam: false,
                message: 'Streaming all College Football games',
                suffix: ''
            },
            mlb: {
                baseUrl: 'https://thetvapp.to/mlb',
                title: 'Baseball Streamer',
                placeholder: '',
                storageKey: 'baseball_team',
                requiresTeam: false,
                message: 'Streaming all MLB baseball games',
                suffix: ''
            },
            nhl: {
                baseUrl: 'https://nhlstreams.io/',
                title: 'Hockey Streamer',
                placeholder: '',
                storageKey: 'hockey_team',
                requiresTeam: false,
                message: 'Streaming all NHL hockey games',
                suffix: ''
            }
        };

        // Function to update iframe source
        function updateTeam(sport, team) {
            const config = sportConfig[sport];

            if (config.requiresTeam) {
                const formattedTeam = team.toLowerCase().replace(/\s+/g, '');
                const fullUrl = config.baseUrl + formattedTeam + config.suffix;

                sportsFrame.src = fullUrl;
                localStorage.setItem(config.storageKey, formattedTeam);
                currentTeam.textContent = 'Currently watching: ' + formattedTeam;
                teamInput.value = formattedTeam;
            } else {
                sportsFrame.src = config.baseUrl;
            }

            updateShareLink(sport, team);
        }

        // Function to set up the UI for the current sport
        function setupSportUI(sport) {
            const config = sportConfig[sport];
            sportTitle.textContent = config.title;

            if (config.requiresTeam) {
                teamControls.style.display = 'flex';
                currentTeam.style.display = 'block';
                sportMessage.style.display = 'none';
                teamInput.placeholder = config.placeholder;

                const savedTeam = localStorage.getItem(config.storageKey);

                if (savedTeam) {
                    currentTeam.textContent = 'Currently watching: ' + savedTeam;
                    sportsFrame.src = config.baseUrl + savedTeam + config.suffix;
                    teamInput.value = savedTeam;
                    updateShareLink(sport, savedTeam);
                } else {
                    currentTeam.textContent = 'Enter a team name to start watching';
                    sportsFrame.src = '';
                    updateShareLink(sport, '');
                }
            } else {
                teamControls.style.display = 'none';
                currentTeam.style.display = 'none';
                sportMessage.style.display = 'block';
                sportMessage.textContent = config.message;
                sportsFrame.src = config.baseUrl;
                updateShareLink(sport, '');
            }
        }

        // Function to update the share link
        function updateShareLink(sport, team) {
            let url = 'https://gukeeee.pages.dev/sports';
            const friendlySportName = reverseSportMapping[sport];

            if (friendlySportName) {
                url = `https://gukeeee.pages.dev/sports/${friendlySportName}`;

                if (sportConfig[sport].requiresTeam && team) {
                    url += `/${team}`;
                }
            }

            shareLink.value = url;
        }

        // Function to reload the current stream
        function reloadStream() {
            if (sportsFrame.src) {
                const currentSrc = sportsFrame.src;
                sportsFrame.src = '';
                setTimeout(() => {
                    sportsFrame.src = currentSrc;
                }, 100);
            }
        }

        // Function to handle URL parameters
        function handleURLParameters() {
            const paramSport = localStorage.getItem('param_sport');
            const paramTeam = localStorage.getItem('param_team');

            if (paramSport && sportConfig[paramSport]) {
                sportSelector.value = paramSport;
                setupSportUI(paramSport);

                if (paramTeam && sportConfig[paramSport].requiresTeam) {
                    updateTeam(paramSport, paramTeam);
                }

                localStorage.removeItem('param_sport');
                localStorage.removeItem('param_team');

                return true;
            }

            return false;
        }

        // Function to check if we're on a 404 page and should be redirected
        function checkAndRedirect() {
            const path = window.location.pathname;
            const pathParts = path.split('/').filter(part => part.length > 0);

            if (pathParts.length >= 2 && pathParts[0] === 'sports') {
                const sportName = pathParts[1];
                let sportValue = sportMapping[sportName];

                if (sportValue && sportConfig[sportValue]) {
                    const teamName = pathParts.length >= 3 ? pathParts[2] : '';

                    localStorage.setItem('param_sport', sportValue);
                    if (teamName) {
                        localStorage.setItem('param_team', teamName);
                    }

                    if (path !== '/sports' && path !== '/sports.html') {
                        window.location.href = 'https://gukeeee.pages.dev/sports';
                        return true;
                    }
                }
            }

            return false;
        }

        // Initialize
        function init() {
            cacheElements();

            if (checkAndRedirect()) {
                return;
            }

            const parametersApplied = handleURLParameters();

            if (!parametersApplied) {
                let initialSport = localStorage.getItem('current_sport') || 'soccer';
                sportSelector.value = initialSport;
                setupSportUI(initialSport);
            }

            // Event listeners (bound here since elements are created after header render)
            sportSelector.addEventListener('change', function() {
                const selectedSport = this.value;
                localStorage.setItem('current_sport', selectedSport);
                setupSportUI(selectedSport);
            });

            updateButton.addEventListener('click', function() {
                const currentSport = sportSelector.value;
                const config = sportConfig[currentSport];

                if (config.requiresTeam) {
                    const newTeam = teamInput.value.trim();
                    if (newTeam) {
                        updateTeam(currentSport, newTeam);
                    }
                }
            });

            clearButton.addEventListener('click', function() {
                clearTeamSelection();
            });

            teamInput.addEventListener('keyup', function(event) {
                if (event.key === 'Enter') {
                    const currentSport = sportSelector.value;
                    const config = sportConfig[currentSport];

                    if (config.requiresTeam) {
                        const newTeam = teamInput.value.trim();
                        if (newTeam) {
                            updateTeam(currentSport, newTeam);
                        }
                    }
                }
            });

            shareButton.addEventListener('click', function() {
                shareLinkContainer.style.display = 'block';
                shareLink.select();
                shareLink.setSelectionRange(0, 99999);

                try {
                    navigator.clipboard.writeText(shareLink.value);
                    alert('Share link copied to clipboard!');
                } catch (err) {
                    alert('Please manually copy the share link displayed.');
                }
            });

            closeShareLink.addEventListener('click', function() {
                shareLinkContainer.style.display = 'none';
            });

            reloadButton.addEventListener('click', function() {
                reloadStream();
            });
        }

        // Function to clear the current team selection
        function clearTeamSelection() {
            const currentSport = sportSelector.value;
            const config = sportConfig[currentSport];

            if (config.requiresTeam) {
                localStorage.removeItem(config.storageKey);
                currentTeam.textContent = 'Enter a team name to start watching';
                teamInput.value = '';
                sportsFrame.src = '';
                updateShareLink(currentSport, '');
            }
        }
    </script>
</body>
</html>
