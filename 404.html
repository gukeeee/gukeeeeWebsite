<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--space-5);
        }
        .notfound-card {
            width: 90%;
            max-width: 480px;
            padding: var(--space-7) var(--space-5);
        }
        .notfound-card .logo {
            height: 56px;
            margin-bottom: var(--space-4);
        }
        .notfound-card h1 {
            color: var(--color-danger);
            font-size: 1.8rem;
        }
        .notfound-card p {
            color: var(--color-text-muted);
            margin-bottom: var(--space-5);
        }
    </style>
    <script>
        // Check for sports URLs and redirect instantly
        (function() {
            const path = window.location.pathname;
            const pathParts = path.split('/').filter(part => part.length > 0);

            // Sport mapping from the sports page
            const sportMapping = {
                'soccer': 'soccer',
                'basketball': 'nba',
                'football': 'nfl',
                'hockey': 'nhl',
                'collegebasketball': 'collegebball',
                'collegefootball': 'collegefball',
                'baseball': 'mlb'
            };

            // Check if we're at a sports URL with parameters
            if (pathParts.length >= 2 && pathParts[0] === 'sports') {
                // Get the sport name from path
                const sportName = pathParts[1];
                let sportValue = sportMapping[sportName];

                // If we found a valid sport
                if (sportValue) {
                    // Get team name if present
                    const teamName = pathParts.length >= 3 ? pathParts[2] : '';

                    // Store parameters for after redirect
                    localStorage.setItem('param_sport', sportValue);
                    if (teamName) {
                        localStorage.setItem('param_team', teamName);
                    }

                    // Redirect immediately to sports page
                    window.location.href = '/sports';

                    // Prevent page from rendering
                    document.documentElement.style.display = 'none';
                }
            }
        })();
    </script>
</head>
<body>
    <div class="card notfound-card">
        <img src="/gukeeee-logo-red.png" alt="Gukeeee Logo" class="logo">
        <h1>404 - Página no encontrada</h1>
        <p>La página que buscas no existe o fue movida.</p>
        <a href="/" class="btn btn-primary">Ir al inicio</a>
    </div>
</body>
</html>
